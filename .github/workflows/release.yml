name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  pull-requests: write
  contents: write

jobs:
  apply-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify docs/update matches the tag
        run: |
          set -euo pipefail
          TAG_SHA=$(git rev-parse HEAD)
          for i in $(seq 1 12); do
            git fetch origin --prune
            BRANCH_SHA=$(git rev-parse origin/docs/update 2>/dev/null || echo none)
            if [ "$BRANCH_SHA" = "$TAG_SHA" ]; then
              echo "docs/update matches the tag ($TAG_SHA)"
              exit 0
            fi
            echo "docs/update at $BRANCH_SHA, expected $TAG_SHA - waiting 5s ($i/12)"
            sleep 5
          done
          echo "::error::docs/update does not match tag ${{ github.ref_name }}"
          exit 1

      - name: Create or reuse Pull Request
        id: cpr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only origin/main...origin/docs/update | wc -l)
          echo "files_changed=$CHANGED"
          if [ "$CHANGED" -eq 0 ]; then
            echo "No docs changes vs main; skipping PR."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_number=$(gh pr list --head docs/update --base main --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            echo "Reusing open PR #$pr_number"
          else
            gh pr create --head docs/update --base main \
              --title "Docs Update for ${{ github.ref_name }}" \
              --body "Docs Update for ${{ github.ref_name }}"
            pr_number=$(gh pr list --head docs/update --base main --state open \
              --json number --jq '.[0].number')
            echo "Created PR #$pr_number"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Merge Pull Request
        if: steps.cpr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.cpr.outputs.pr_number }}"
          gh pr merge --squash --auto "$PR" || gh pr merge --squash "$PR"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          prerelease: false
          draft: false
